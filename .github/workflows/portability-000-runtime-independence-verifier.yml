name: PORTABILITY-000 independent runtime verifier

on:
  push:
    branches:
      - verify/portability-000-runtime-independence
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.19.0
  PORTABILITY_PRODUCT_SHA: 935c568ab273f9adae8c23785a77191e676e82c4

jobs:
  verifier-static:
    name: VERIFIER_STATIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run independent static verifier
        run: node scripts/verifier/portability-000/static-verifier.mjs --report-only
      - name: Run verifier-owned assertions
        run: pnpm exec vitest run tests/verifier/portability-000 --reporter=verbose

  verifier-container:
    name: VERIFIER_CONTAINER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run independent OCI and runtime verifier
        run: node scripts/verifier/portability-000/container-verifier.mjs

  verifier-regression:
    name: VERIFIER_REGRESSION
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assurance:check
      - run: pnpm test
      - run: pnpm typecheck && pnpm lint
      - run: pnpm build
      - name: PostgreSQL 17 D2 regression
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_portability_d2
        run: pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose
