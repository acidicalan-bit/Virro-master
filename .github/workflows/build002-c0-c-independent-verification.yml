name: BUILD 002-C0-C independent verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  independent-verification:
    name: Independent PostgreSQL 17 C0-C closure
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_independent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_independent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Independent native PostgreSQL 17 verifier
        env:
          BUILD002_C0_C_INDEPENDENT: "true"
          BUILD002_C0_C_INDEPENDENT_PG_URL: postgresql://postgres:postgres@localhost:5432/virro_independent
        run: pnpm exec vitest run tests/native/verification/build002-c0-c-independent.e3.test.ts --reporter=verbose
      - name: Assurance manifest
        run: pnpm assurance:check
      - name: SQL regression
        run: pnpm test:sql
      - name: Assurance regression
        run: pnpm test:assurance
      - name: Model regression
        run: pnpm test:model
      - name: Application regression
        run: pnpm test:application
      - name: Full Vitest regression
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build
