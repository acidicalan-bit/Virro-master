name: PORTABILITY-000 container independence

on:
  pull_request:
  push:
    branches:
      - foundation/portability-000-container-runtime
      - foundation/portability-000-r3
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.19.0

jobs:
  portability-static:
    name: PORTABILITY_STATIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm portability:check
      - run: pnpm portability:env

  container-build:
    name: CONTAINER_BUILD
    runs-on: ubuntu-latest
    needs: portability-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build immutable source-tagged image
        run: docker build --build-arg SOURCE_SHA=${GITHUB_SHA} -t virro-product:${GITHUB_SHA} .
      - name: Inspect OCI identity and non-root contract
        run: |
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/acidicalan-bit/Virro-master"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "root"
          docker image inspect virro-product:${GITHUB_SHA} --format 'IMAGE_DIGEST={{.Id}} IMAGE_SIZE_BYTES={{.Size}}'
      - name: Reject missing and malformed source identity
        run: |
          set +e
          values=("__MISSING__" "unknown" "abc" "$(printf 'a%.0s' {1..39})" "$(printf 'a%.0s' {1..41})" "${GITHUB_SHA^^}")
          for value in "${values[@]}"; do
            if [ "$value" = "__MISSING__" ]; then
              docker build . >/dev/null 2>&1
            else
              docker build --build-arg SOURCE_SHA="$value" . >/dev/null 2>&1
            fi
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "SOURCE_SHA_ATTACK_ACCEPTED:$value"
              exit 1
            fi
          done
          set -e

  container-smoke:
    name: CONTAINER_SMOKE
    runs-on: ubuntu-latest
    needs: portability-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run read-only liveness, restart, and shutdown smoke
        env:
          PORTABILITY_SOURCE_SHA: ${{ github.sha }}
          PORTABILITY_IMAGE_TAG: virro-product:${{ github.sha }}
        run: node scripts/portability/container-smoke.mjs

  regression:
    name: PORTABILITY_REGRESSION
    runs-on: ubuntu-latest
    needs: portability-static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assurance:check
      - run: pnpm test
      - run: pnpm typecheck && pnpm lint
      - run: pnpm build
      - name: PostgreSQL 17 D2 scoped reader
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_portability_d2
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose 2>&1 | tee d2-native.log
          node -e "const s=require('fs').readFileSync('d2-native.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+1 passed/.test(s)) process.exit(1)"
          rm d2-native.log
      - name: PostgreSQL 17 D0 authority commit
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose 2>&1 | tee d0-native.log
          node -e "const s=require('fs').readFileSync('d0-native.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+10 passed/.test(s)) process.exit(1)"
          rm d0-native.log
