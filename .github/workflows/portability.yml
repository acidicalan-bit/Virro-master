name: PORTABILITY-000 container independence

on:
  pull_request:
  push:
    branches:
      - foundation/portability-000-container-runtime
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.19.0

jobs:
  portability-static:
    name: PORTABILITY_STATIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm portability:check
      - run: pnpm portability:env

  container-build:
    name: CONTAINER_BUILD
    runs-on: ubuntu-latest
    needs: portability-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build immutable source-tagged image
        run: docker build --build-arg SOURCE_SHA=${GITHUB_SHA} -t virro-product:${GITHUB_SHA} .
      - name: Inspect OCI identity and non-root contract
        run: |
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/acidicalan-bit/Virro-master"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "root"
          docker image inspect virro-product:${GITHUB_SHA} --format 'IMAGE_DIGEST={{.Id}} IMAGE_SIZE_BYTES={{.Size}}'

  container-smoke:
    name: CONTAINER_SMOKE
    runs-on: ubuntu-latest
    needs: portability-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run read-only liveness, restart, and shutdown smoke
        env:
          PORTABILITY_SOURCE_SHA: ${{ github.sha }}
          PORTABILITY_IMAGE_TAG: virro-product:${{ github.sha }}
        run: node scripts/portability/container-smoke.mjs

  regression:
    name: PORTABILITY_REGRESSION
    runs-on: ubuntu-latest
    needs: portability-static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assurance:check
      - run: pnpm test
      - run: pnpm typecheck && pnpm lint
      - run: pnpm build
      - name: PostgreSQL 17 D2 scoped reader
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_portability_d2
        run: pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose
