name: BUILD002 C1-D2 post-commit currentness candidate

on:
  push:
    branches:
      - build/build002-c1-d2-postcommit-currentness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: D2 currentness and predecessor regression gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assurance manifest
        run: pnpm assurance:check
      - name: D2 focused currentness suite
        run: pnpm exec vitest run tests/assurance/build002-c1-d2-readiness-currentness.test.ts --reporter=verbose
      - name: D2 native PostgreSQL 17 scoped commit reader
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose
      - name: D1 authored regression
        run: pnpm exec vitest run tests/assurance/build002-c1-d1-readiness-authority-orchestration.test.ts --reporter=verbose
      - name: D0 native PostgreSQL 17 regression
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose
      - name: TypeScript and ESLint
        run: pnpm typecheck && pnpm lint
      - name: Full regression
        run: pnpm test
      - name: Production build
        run: pnpm build
