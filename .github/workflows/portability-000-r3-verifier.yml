name: PORTABILITY-000-R3.1 independent verifier

on:
  workflow_dispatch:
  push:
    branches:
      - verify/portability-000-r3-runtime-independence

permissions:
  contents: read

env:
  PRODUCT_SHA: 6f3dc26601d453ff699e01259bdc09c61bdd2679
  BASE_SHA: d8e31040b5479cecc52971e9d0efc9da2628eb04
  R3_SHA: 5144e87d0f6f7ba4e403f40aa45061d88ed4cd48
  NODE_VERSION: 24
  PNPM_VERSION: 11.19.0

jobs:
  verifier-static:
    name: VERIFIER_STATIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch frozen audit ancestry
        run: git fetch --no-tags origin ${BASE_SHA} ${R3_SHA} ${PRODUCT_SHA}
      - name: Assert verifier identity and fail-closed evidence
        run: node scripts/verifier/portability-000-r3/verify.mjs
      - name: Run verifier test
        run: pnpm exec vitest run tests/verifier/portability-000-r3/independent-verifier.test.ts

  verifier-container:
    name: VERIFIER_CONTAINER
    runs-on: ubuntu-latest
    needs: verifier-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build exact product identity image
        run: |
          mkdir -p coverage
          printf 'PORTABILITY_FAKE_SECRET_CANARY=never-ship\n' > .env.local
          printf 'PORTABILITY_FAKE_COVERAGE_CANARY\n' > coverage/portability-canary.txt
          docker build --build-arg SOURCE_SHA=${PRODUCT_SHA} -t virro-r3-product:${PRODUCT_SHA} .
      - name: Assert OCI identity and fail-closed source SHA
        run: |
          test "$(docker image inspect virro-r3-product:${PRODUCT_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${PRODUCT_SHA}"
          test "$(docker image inspect virro-r3-product:${PRODUCT_SHA} --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/acidicalan-bit/Virro-master"
          test "$(docker image inspect virro-r3-product:${PRODUCT_SHA} --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect virro-r3-product:${PRODUCT_SHA} --format '{{.Config.User}}')" != "root"
          ! docker run --rm --entrypoint sh virro-r3-product:${PRODUCT_SHA} -c "! grep -R -E 'PORTABILITY_FAKE_(SECRET|COVERAGE)_CANARY' /app 2>/dev/null"
          set +e
          for value in unknown abc "$(printf 'a%.0s' {1..39})" "$(printf 'a%.0s' {1..41})" "${PRODUCT_SHA^^}" zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz; do
            docker build --build-arg SOURCE_SHA="$value" . >/dev/null 2>&1
            test $? -ne 0 || exit 1
          done
          docker build . >/dev/null 2>&1
          test $? -ne 0 || exit 1
          set -e
      - name: Run independent runtime smoke
        env:
          PORTABILITY_SOURCE_SHA: ${{ env.PRODUCT_SHA }}
          PORTABILITY_IMAGE_TAG: virro-r3-product:${{ env.PRODUCT_SHA }}
        run: node scripts/portability/container-smoke.mjs

  verifier-regression:
    name: VERIFIER_REGRESSION
    runs-on: ubuntu-latest
    needs: verifier-static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch frozen audit ancestry
        run: git fetch --no-tags origin ${BASE_SHA} ${R3_SHA} ${PRODUCT_SHA}
      - run: pnpm portability:check
      - run: pnpm portability:env
      - run: pnpm assurance:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: D1 regression and D2 authored tests
        run: pnpm exec vitest run tests/integration/build002-b-persistence-rls.integration.test.ts tests/assurance/build002-c1-d2*.test.ts
      - name: D2 PostgreSQL 17 native gate, skip-detected
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose 2>&1 | tee d2.log
          node -e "const s=require('fs').readFileSync('d2.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+1 passed/.test(s) || /skipped/i.test(s)) process.exit(1)"
      - name: D0 PostgreSQL 17 native gate, skip-detected
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose 2>&1 | tee d0.log
          node -e "const s=require('fs').readFileSync('d0.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+10 passed/.test(s) || /skipped/i.test(s)) process.exit(1)"
