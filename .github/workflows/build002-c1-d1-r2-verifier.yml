name: BUILD 002-C1-D1 R2 independent verifier

on:
  push:
    branches:
      - verify/build002-c1-d1-r2
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: e8c3afd69db1067cfeef99ecf105f62a5965df20
  PRODUCT_TREE: db3cadaecb7c026bc27c2e648e96160f14fa955c

jobs:
  verifier:
    name: Independent R2 coherence and regression gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3_c1_d0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3_c1_d0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify frozen product identity and verifier-only diff
        run: |
          test "$(git rev-parse "$PRODUCT_SHA")" = "$PRODUCT_SHA"
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$PRODUCT_TREE"
          forbidden=$(git diff --name-only "$PRODUCT_SHA"..HEAD | grep -Ev '^(\.github/workflows/build002-c1-d1-r2-verifier\.yml|tests/verifier/build002-c1-d1-r2/|docs/builds/build-002/002-C1-D1/verifier-r2/)' || true)
          test -z "$forbidden"
      - name: Independent R2 result-coherence verifier
        run: pnpm exec vitest run tests/verifier/build002-c1-d1-r2/r2-result-coherence.test.ts --reporter=verbose
      - name: Authored D1 regression
        run: pnpm exec vitest run tests/assurance/build002-c1-d1-readiness-authority-orchestration.test.ts --reporter=verbose
      - name: Native PostgreSQL 17 D0 regression
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/virro_e3_c1_d0
        run: pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose
      - name: Assurance manifest
        run: pnpm assurance:check
      - name: Full regression
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build
