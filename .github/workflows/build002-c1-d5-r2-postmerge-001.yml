name: BUILD002 C1-D5-R2 exact merge postmerge proof

on:
  push:
    branches: [verify/build002-c1-d5-r2-postmerge-001]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.19.0
  MERGE_SHA: e13224fd2bf2b370db209d9537e56672a4409ccb
  MERGE_TREE: 8e56edd3b67cdac0031e4e62aac48175c656f17d
  PRODUCT_SHA: eb739b58c77ee7a114c24a7392e3a569190f84a8
  PRODUCT_TREE: 8e56edd3b67cdac0031e4e62aac48175c656f17d
  EXPECTED_MAIN_PARENT: 51e283c3a830d444170a589a6ba7ad6a837607ed

jobs:
  exact-boundary:
    name: exact-merge-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: bind exact merge and product boundary
        shell: bash
        run: |
          test "$(git rev-parse HEAD^1)" = "${MERGE_SHA}"
          test "$(git show -s --format=%T ${MERGE_SHA})" = "${MERGE_TREE}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${MERGE_SHA}"
          git diff --quiet "${MERGE_SHA}"...HEAD -- \
            src app lib supabase/migrations package.json pnpm-lock.yaml Dockerfile \
            next.config.* vercel.json
          git diff --quiet "${PRODUCT_SHA}"..."${MERGE_SHA}" -- \
            src app lib supabase/migrations package.json pnpm-lock.yaml Dockerfile \
            next.config.* vercel.json
          test "$(git show -s --format=%P ${MERGE_SHA})" = "${EXPECTED_MAIN_PARENT} ${PRODUCT_SHA}"
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/verification --reporter=verbose
      - run: git diff --check

  native-postgres17:
    name: exact-merge-postgres17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BUILD002_POSTMERGE_NATIVE: "true"
      BUILD002_POSTMERGE_MODE: r2
      BUILD002_POSTMERGE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_C1_D0: "true"
      BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_C1_D2: "true"
      BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_C1_D3: "true"
      BUILD002_NATIVE_PG_C1_D3_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_C1_D4_R2: "true"
      BUILD002_NATIVE_PG_C1_D4_R2_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUILD002_NATIVE_PG_C1_D5_R0: "true"
      BUILD002_NATIVE_PG_C1_D5_R0_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: assert product source is exact merge
        shell: bash
        run: |
          test "$(git rev-parse HEAD^1)" = "${MERGE_SHA}"
          git diff --quiet "${MERGE_SHA}"...HEAD -- \
            src app lib supabase/migrations package.json pnpm-lock.yaml Dockerfile \
            next.config.* vercel.json
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: exact-merge D5 contract
        run: pnpm exec vitest run tests/verification/build002-c1-d5-r2-postmerge-001-native.e3.test.ts --reporter=verbose
      - name: D0 PostgreSQL 17 regression
        run: pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose
      - name: D2 PostgreSQL 17 regression
        run: pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose
      - name: D3 PostgreSQL 17 regression
        run: pnpm exec vitest run tests/native/build002-c1-d3-postgres.e3.test.ts --reporter=verbose
      - name: D4-R2 PostgreSQL 17 regression
        run: pnpm exec vitest run tests/native/build002-c1-d4-r2-postgres.e3.test.ts --reporter=verbose
      - name: D5 PostgreSQL 17 regression
        run: pnpm exec vitest run tests/native/build002-c1-d5-r0-postgres.e3.test.ts --reporter=verbose

  full-regression:
    name: exact-merge-full-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.MERGE_SHA }}", fetch-depth: 0 }
      - run: test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run assurance:check
      - run: pnpm run portability:check
      - run: pnpm run portability:env
      - run: pnpm test -- --reporter=dot
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  dual-runtime:
    name: exact-merge-dual-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.MERGE_SHA }}", fetch-depth: 0 }
      - run: test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: VERCEL=1 pnpm build
      - run: pnpm build

  container:
    name: exact-merge-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.MERGE_SHA }}", fetch-depth: 0 }
      - run: test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PORTABILITY_SOURCE_SHA=${MERGE_SHA} pnpm run portability:smoke
