name: BUILD002 C1-D3 R3 retry admissibility closure

on:
  push:
    branches:
      - build/build002-c1-d3-r3-retry-admissibility-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-regression:
    name: D3 R3 PostgreSQL 17 and regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assurance:check && pnpm portability:check && pnpm portability:env
      - name: R3 native PostgreSQL 17 evidence
        env:
          BUILD002_NATIVE_PG_C1_D3: "true"
          BUILD002_NATIVE_PG_C1_D3_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-c1-d3-postgres.e3.test.ts --reporter=verbose
      - name: D2 native PostgreSQL 17 regression
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose
      - name: D0 native PostgreSQL 17 regression
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose
      - run: pnpm test:sql && pnpm test:model && pnpm test:application
      - name: TypeScript and ESLint
        run: pnpm typecheck && pnpm lint
      - name: Standalone build without Vercel mode
        run: |
          unset VERCEL
          pnpm build
          test -f .next/standalone/server.js
      - name: Vercel build mode
        env:
          VERCEL: "1"
        run: pnpm build
      - name: Full Vitest
        run: pnpm test

  container:
    name: R3 exact OCI and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build exact source image
        run: docker build --build-arg SOURCE_SHA=${GITHUB_SHA} -t virro-product:${GITHUB_SHA} .
      - name: Verify OCI revision and non-root image
        run: |
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect virro-product:${GITHUB_SHA} --format '{{.Config.User}}')" != "root"
      - name: Container health, restart, shutdown and read-only smoke
        env:
          PORTABILITY_SOURCE_SHA: ${{ github.sha }}
          PORTABILITY_IMAGE_TAG: virro-product:${{ github.sha }}
        run: node scripts/portability/container-smoke.mjs
