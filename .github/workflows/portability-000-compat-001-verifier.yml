name: PORTABILITY-000-COMPAT-001 independent verifier

on:
  push:
    branches:
      - verify/portability-000-compat-001-vercel-runtime
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.19.0

jobs:
  independent-verifier:
    name: COMPAT_001_INDEPENDENT_VERIFIER
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run fail-closed independent verifier
        run: node scripts/verifier/portability-000-compat-001/verify.mjs --root "$GITHUB_WORKSPACE"
      - name: Run verifier regression test
        run: pnpm exec vitest run tests/verifier/portability-000-compat-001/compat-verifier.test.ts --reporter=verbose
      - name: Portability and assurance regression
        run: |
          pnpm portability:check
          pnpm portability:env
          pnpm assurance:check
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build
      - name: PostgreSQL 17 D2 authored boundary
        env:
          BUILD002_NATIVE_PG_C1_D2: "true"
          BUILD002_NATIVE_PG_C1_D2_URL: postgresql://postgres:postgres@localhost:5432/virro_portability_d2
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d2-scoped-reader.e3.test.ts --reporter=verbose 2>&1 | tee d2-native.log
          node -e "const s=require('fs').readFileSync('d2-native.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+1 passed/.test(s)) process.exit(1)"
          rm d2-native.log
      - name: PostgreSQL 17 D0 authority boundary
        env:
          BUILD002_NATIVE_PG_C1_D0: "true"
          BUILD002_NATIVE_PG_C1_D0_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          pnpm exec vitest run tests/native/build002-c1-d0-postgres.e3.test.ts --reporter=verbose 2>&1 | tee d0-native.log
          node -e "const s=require('fs').readFileSync('d0-native.log','utf8').replace(/\\x1b\\[[0-9;]*m/g,''); if (!/Tests\\s+10 passed/.test(s)) process.exit(1)"
          rm d0-native.log
