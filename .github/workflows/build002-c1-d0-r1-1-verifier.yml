name: BUILD002-C1-D0 R1-1 independent verifier

on:
  push:
    branches:
      - verify/build002-c1-d0-r1-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_verifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_verifier"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Independent application attacks
        run: pnpm exec vitest run tests/verifier/build002-c1-d0-r1-1.application.verifier.test.ts --reporter=verbose
      - name: Independent PostgreSQL 17 attacks
        env:
          BUILD002_VERIFIER_NATIVE_PG: "true"
          BUILD002_VERIFIER_NATIVE_PG_URL: postgresql://postgres:postgres@localhost:5432/virro_verifier
        run: pnpm exec vitest run tests/verifier/build002-c1-d0-r1-1.postgres.verifier.test.ts --reporter=verbose
      - name: Assurance and product regression
        run: pnpm assurance:check && pnpm test
      - name: TypeScript and ESLint
        run: pnpm typecheck && pnpm lint
      - name: Production build
        run: pnpm build
