name: Evidence-classified assurance

on:
  pull_request:
  push:
    branches:
      - foundation/virro-vnext
  workflow_dispatch:
    inputs:
      run_staging:
        description: Run the isolated E4 RPC staging sample
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic:
    name: Required E0-E3 deterministic gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virro_e3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virro_e3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Manifest freshness and environment gaps
        run: pnpm assurance:check && pnpm assurance:environment
      - name: E0-E2 assurance rules and application boundaries
        run: pnpm test:assurance && pnpm test:model && pnpm test:application
      - name: E3 required local PostgreSQL boundary
        run: pnpm test:sql
      - name: E3 native PostgreSQL 17 boundary
        env:
          BUILD002_NATIVE_PG_E3: "true"
          BUILD002_NATIVE_PG_URL: postgresql://postgres:postgres@localhost:5432/virro_e3
        run: pnpm exec vitest run tests/native/build002-b-postgres.e3.test.ts --reporter=verbose
      - name: E3 native PostgreSQL 17 C0-C transaction binding boundary
        env:
          BUILD002_NATIVE_PG_C0_C: "true"
          BUILD002_NATIVE_PG_URL: postgresql://postgres:postgres@localhost:5432/virro_e3_c0_c
        run: pnpm exec vitest run tests/native/build002-c0-c-postgres.e3.test.ts --reporter=verbose
      - name: E3 native PostgreSQL 17 C0-E composed authority chain
        env:
          BUILD002_NATIVE_PG_C0_E: "true"
          BUILD002_NATIVE_PG_URL: postgresql://postgres:postgres@localhost:5432/virro_e3_c0_e
        run: pnpm exec vitest run tests/native/build002-c0-e-authority-chain.e3.test.ts --reporter=verbose
      - name: E3 native PostgreSQL 17 C1-A signal universe
        env:
          BUILD002_NATIVE_PG_C1_A: "true"
          BUILD002_NATIVE_PG_C1_A_URL: postgresql://postgres:postgres@localhost:5432/virro_e3_c1_a
        run: pnpm exec vitest run tests/native/build002-c1-a-postgres.e3.test.ts --reporter=verbose
      - name: TypeScript and ESLint
        run: pnpm typecheck && pnpm lint
      - name: Complete deterministic regression
        run: pnpm test
      - name: Production build
        run: pnpm build

  staging-rpc-sample:
    name: Optional E4 anonymous RPC ACL sample
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging
    runs-on: ubuntu-latest
    environment: assurance-staging
    env:
      RUN_BUILD001_TRUST_INTEGRATION: "true"
      VIRRO_STAGING_ASSURANCE_ACK: ISOLATED_NON_PRODUCTION
      SUPABASE_URL: ${{ secrets.ASSURANCE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.ASSURANCE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:staging
